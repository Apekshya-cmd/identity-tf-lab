name: identity-terraform

on:
  pull_request:
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write       # required for GitHub OIDC -> AWS
  contents: read
  pull-requests: write  # to comment the plan on the PR

concurrency:
  group: identity-terraform-mgmt   # never two runs on the same state at once
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: ap-south-1
  WORKDIR: live/mgmt

jobs:
  plan:
    name: Plan (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume read-only plan role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check (warning only in the lab)
        run: |
          terraform fmt -check -recursive ../.. || \
            echo "::warning::Formatting differs. Run 'terraform fmt -recursive' locally and commit."

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.WORKDIR}/plan.txt`, 'utf8');
            const body = [
              '### Terraform plan: `live/mgmt`',
              '```',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan,
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    name: Apply (main, approval required)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # required reviewers; makes the OIDC sub "...:environment:production"
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume apply role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        run: terraform apply -input=false -no-color tfplan
